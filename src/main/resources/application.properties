spring.application.name=ecommerce-mcp

spring.ai.mcp.server.name=ecommerce-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE

# PostgreSQL (compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:15432/ecommerce
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# Ollama embedding (bge-m3 = 1024 dimensions)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=bge-m3
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.timeout=30m
# 임베딩만 쓰므로 기본 채팅 모델(mistral) pull은 끈다
spring.ai.ollama.init.chat.include=false

# pgvector store: document id = product id
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.id-type=text
spring.ai.vectorstore.pgvector.distance-type=cosine-distance
spring.ai.vectorstore.pgvector.index-type=hnsw

# 의미 검색 최소 유사도(코사인, 0~1). bge-m3 + 상품 51건 기준 측정값:
# 관련 상품은 대체로 0.41~0.58, 무관한 상품은 대체로 0.23~0.42. 0.46 이상부터 관련 상품을 놓치기 시작한다.
# 모델이나 상품 데이터가 바뀌면 다시 측정해서 조정할 것.
app.search.similarity-threshold=0.42

# dev: start compose.yaml services with the app and leave them running
spring.docker.compose.lifecycle-management=start_only

# dev seed data (products + embeddings)
app.seed.enabled=true
