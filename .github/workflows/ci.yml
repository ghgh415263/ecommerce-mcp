name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 같은 브랜치/PR에서 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 설정 (의존성/빌드 캐시)
        uses: gradle/actions/setup-gradle@v4

      # git에 실행 권한 없이(100644) 커밋되어 있어 리눅스 러너에서 직접 부여해야 한다
      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      # 통합 테스트(EcommerceMcpApplicationTests)는 15432 포트의 Postgres(pgvector)가 필요하다.
      # 시드/임베딩과 모델 pull은 테스트에서 꺼져 있으므로 Ollama는 띄우지 않는다.
      - name: Postgres(pgvector) 기동
        run: docker compose up -d --wait postgres

      # checkstyleMain + test 포함
      - name: 빌드
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/checkstyle/
            build/test-results/

      - name: compose 로그 출력
        if: failure()
        run: docker compose logs postgres

      - name: compose 정리
        if: always()
        run: docker compose down -v
